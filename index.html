<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="JetQ: Refresher for Embraer Pilots. Selbsttest und Lernen fuer E1- und E2-Piloten.">
<link rel="icon" type="image/png" href="jetq-logo-sm-v3.png">
<title>JetQ</title>
</head>
<body>
<title>JetQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet">
<style>
/* JetQ: calm EFB / flight-manual look. Square geometry, thin rules, Swiss red as the only strong accent. */
:root{
  --bg:#F1F2F4; --surface:rgba(255,255,255,.88); --surface2:#F6F7F8; --ink:#1A1F25; --soft:#56606A; --line:#D6DADF; --line2:#B9C0C8; --rule:#262C33;
  --red:#E30613; --red-d:#A3040D; --red-t:rgba(227,6,19,.07); --char:#262C33; --onchar:#FFFFFF; --sel:#262C33; --onsel:#FFFFFF; --silver:#9AA3AD;
  --ok:#1D7A46; --bad:#C0261F; --ok-t:rgba(29,122,70,.09); --bad-t:rgba(192,38,31,.08); --focus:#E30613;
  --grid:rgba(30,40,55,.035); --bg2:#E3E8EE; --bgimg:radial-gradient(1100px 700px at 8% 0%,rgba(96,150,200,.42),transparent 62%),radial-gradient(900px 640px at 95% 12%,rgba(218,41,28,.10),transparent 60%),radial-gradient(1300px 820px at 70% 105%,rgba(236,186,130,.42),transparent 66%),linear-gradient(160deg,#d7e3ee 0%,#e8ebef 48%,#f2e7da 100%); --bgop:1; --chart:rgba(28,58,96,.13); --logo-bg:transparent; --shade:0 1px 0 rgba(20,25,30,.04);
  --c-daily:#8A6534; --c-command:#7A6A22; --c-samba:#2C6E78; --c-sys:#3E4A57; --c-limits:#A3402F; --c-perf:#2E7748; --c-proc:#9E1C24;
  --c-ops:#2C5D8A; --c-rules:#1E6F6F; --c-airlaw:#57498A; --c-zrh:#E30613; --c-mem:#E30613; --c-winter:#2F6EA3; --c-sommer:#B8741A; --c-fruehling:#3F7F3A; --c-herbst:#A4532A;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --r:0px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1114; --surface:rgba(22,26,31,.88); --surface2:#1B2026; --ink:#E6E9EC; --soft:#9DA6B0; --line:#2A3139; --line2:#3B444E; --rule:#C9CFD6;
  --red:#FF3341; --red-d:#C4101C; --red-t:rgba(255,51,65,.12); --char:#22282F; --onchar:#F2F4F6; --sel:#DCE1E6; --onsel:#111418; --silver:#7D8792;
  --ok:#4CC27F; --bad:#FF6A62; --ok-t:rgba(76,194,127,.12); --bad-t:rgba(255,106,98,.11); --focus:#FF5A63;
  --grid:rgba(200,215,230,.028); --bg2:#080B0E; --bgimg:radial-gradient(1100px 700px at 8% 0%,rgba(58,112,178,.38),transparent 62%),radial-gradient(900px 640px at 95% 12%,rgba(210,40,60,.15),transparent 60%),radial-gradient(1300px 820px at 70% 105%,rgba(118,80,170,.28),transparent 66%),linear-gradient(160deg,#0f1c2d 0%,#131a26 50%,#1d1729 100%); --bgop:1; --chart:rgba(150,185,225,.14); --logo-bg:transparent; --shade:none;
  --c-daily:#C49A62; --c-command:#C2AE5C; --c-samba:#6BC2CC; --c-sys:#8E9BAA; --c-limits:#E07A66; --c-perf:#5DB97E; --c-proc:#FF6A70;
  --c-ops:#6A9FD0; --c-rules:#4DB5B5; --c-airlaw:#9C8FD8; --c-zrh:#FF3341; --c-mem:#FF3341; --c-winter:#79AEE0; --c-sommer:#E3A24A; --c-fruehling:#7CC274; --c-herbst:#E08A5C;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1114; --surface:rgba(22,26,31,.88); --surface2:#1B2026; --ink:#E6E9EC; --soft:#9DA6B0; --line:#2A3139; --line2:#3B444E; --rule:#C9CFD6;
  --red:#FF3341; --red-d:#C4101C; --red-t:rgba(255,51,65,.12); --char:#22282F; --onchar:#F2F4F6; --sel:#DCE1E6; --onsel:#111418; --silver:#7D8792;
  --ok:#4CC27F; --bad:#FF6A62; --ok-t:rgba(76,194,127,.12); --bad-t:rgba(255,106,98,.11); --focus:#FF5A63;
  --grid:rgba(200,215,230,.028); --bg2:#080B0E; --bgimg:radial-gradient(1100px 700px at 8% 0%,rgba(58,112,178,.38),transparent 62%),radial-gradient(900px 640px at 95% 12%,rgba(210,40,60,.15),transparent 60%),radial-gradient(1300px 820px at 70% 105%,rgba(118,80,170,.28),transparent 66%),linear-gradient(160deg,#0f1c2d 0%,#131a26 50%,#1d1729 100%); --bgop:1; --chart:rgba(150,185,225,.14); --logo-bg:transparent; --shade:none;
  --c-daily:#C49A62; --c-command:#C2AE5C; --c-samba:#6BC2CC; --c-sys:#8E9BAA; --c-limits:#E07A66; --c-perf:#5DB97E; --c-proc:#FF6A70;
  --c-ops:#6A9FD0; --c-rules:#4DB5B5; --c-airlaw:#9C8FD8; --c-zrh:#FF3341; --c-mem:#FF3341; --c-winter:#79AEE0; --c-sommer:#E3A24A; --c-fruehling:#7CC274; --c-herbst:#E08A5C;
  color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;color:var(--ink);font:16px/1.55 var(--f-body);background-color:var(--bg);
  background-image:linear-gradient(170deg,var(--bg) 0%,var(--bg) 35%,var(--bg2) 100%);background-attachment:fixed;min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--bgimg);opacity:var(--bgop)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:var(--r)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:12px 20px 80px}
@media (max-width:600px){.wrap{padding-inline:16px}}
h1,h2,h3{font-family:var(--f-body);font-weight:600;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
.ic{font-family:"Material Symbols Sharp";font-weight:400;font-style:normal;font-size:1.25em;line-height:1;width:1em;height:1em;display:inline-block;overflow:hidden;vertical-align:-.22em;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;font-feature-settings:"liga";-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24}
.ic.f{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24}
.emo{font-family:var(--f-emoji);font-style:normal;line-height:1;display:inline-block}
.kicker{font-family:var(--f-cond);font-weight:600;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.phead,.crumbs,.acbar,.nav,.hero,.season,.special,.rub,.kpis,.tblwrap,.thema,.acgroup,.acbanner,.setup,.card,.fact,details.qi,.komp,.kmain,.kside,.qrh,.prep,.panel,.statgrid,.rubstats,.artblock,.toc,.aquiz,.membar,.infos,.searchbox input,.who.login,.langsw,.themebtn{-webkit-backdrop-filter:blur(10px) saturate(1.1);backdrop-filter:blur(10px) saturate(1.1)}
.phead{background:var(--surface);padding:16px;border:1px solid var(--line2)}
.crumbs{background:var(--surface);padding:0 10px;width:fit-content;max-width:100%;border:1px solid var(--line2)}
.acbar{background:var(--surface);padding:8px 12px;width:fit-content;max-width:100%;border:1px solid var(--line2)}
.top .logo,button.logo{background:var(--surface);border:1px solid var(--line2);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:12px;margin:0 0 22px;padding:6px 0 12px;border-bottom:1px solid var(--line2)}
.nav{display:flex;gap:0;border:1px solid var(--line2);background:var(--surface)}
.navbtn{display:inline-flex;align-items:center;gap:7px;min-height:44px;border:0;border-right:1px solid var(--line2);background:transparent;padding:6px 14px;font-weight:500;font-size:.93rem;color:var(--ink)}
.navbtn:last-child{border-right:0}
.navbtn .emo{font-size:1.05em}
.navbtn:hover{background:var(--surface2)}
.navbtn[aria-current="page"]{background:var(--sel);color:var(--onsel);box-shadow:inset 0 -3px 0 var(--red)}
.tright{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.who{display:inline-flex;align-items:center;gap:6px;min-height:40px;max-width:200px;border:0;background:none;padding:0 6px;color:var(--soft);font-size:.9rem;font-weight:500}
.who span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who:hover{color:var(--ink)}
.who .ns{display:none}
.who.login{max-width:none;white-space:nowrap;border:1px solid var(--ink);color:var(--ink);background:var(--surface);padding:0 12px;font-weight:600;min-height:40px}
.who.login:hover{background:var(--sel);color:var(--onsel)}
@media (max-width:760px){.who.login .nl{display:none}.who.login .ns{display:inline}.who.login{padding:0 10px}}
.langsw{display:inline-flex;border:1px solid var(--line2);background:var(--surface)}
.langsw button{border:0;background:transparent;min-width:38px;min-height:38px;padding:0 8px;font-family:var(--f-mono);font-size:.8rem;font-weight:600;color:var(--soft)}
.langsw button[aria-pressed="true"]{background:var(--sel);color:var(--onsel)}
.themebtn{width:40px;height:40px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);display:grid;place-items:center;flex:none}
.themebtn:hover{border-color:var(--ink)}
.lgd{display:none!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lgl{display:none!important}:root:not([data-theme="light"]) .lgd{display:block!important}}
:root[data-theme="dark"] .lgl{display:none!important}:root[data-theme="dark"] .lgd{display:block!important}
.logo{display:block;border:0;background:var(--logo-bg);padding:2px 4px;flex:none}
.logo img{display:block;width:52px;height:auto}
.navbtn .ns{display:none}
@media (max-width:350px){.navbtn{font-size:.64rem!important}}
@media (max-width:760px){
  .topbar{flex-wrap:wrap;gap:10px;padding-top:0}
  .tright{order:1;width:100%;justify-content:flex-end}
  .tright .logo{order:-1;margin-right:auto;padding:0}
  .tright .who{padding-left:0}
  .nav{order:2;width:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
  .navbtn{flex-direction:column;justify-content:center;gap:3px;padding:7px 1px 6px;font-size:.7rem;min-height:54px;text-align:center;line-height:1.1;min-width:0;overflow:hidden}
  .navbtn > span:not(.ic){max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .navbtn .nl{display:none}.navbtn .ns{display:block}
  .navbtn .ic{font-size:1.3rem}
  .logo img{width:46px}
}

/* ---------- generic buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);font-weight:600;font-size:.98rem;text-align:center}
.btn:hover:not([disabled]){background:var(--surface2)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover:not([disabled]){background:var(--red-d);border-color:var(--red-d)}
.btn.dark{background:var(--sel);border-color:var(--sel);color:var(--onsel)}
.btn.dark:hover:not([disabled]){filter:brightness(1.15);background:var(--sel)}
.btn.ghost{border-color:var(--line2)}
.btn.sm{min-height:40px;padding:6px 14px;font-size:.9rem}
.btn[disabled]{opacity:.45;cursor:default}
.center{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.hint{color:var(--soft);font-size:.9rem;margin:0}
.note{color:var(--soft);font-size:.86rem;margin-top:28px;max-width:75ch;border-top:1px solid var(--line);padding-top:12px}
.loading{padding:60px 0;text-align:center;color:var(--soft)}

/* ---------- hero (front page) ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:0;margin:0 0 22px;background:var(--surface);border:1px solid var(--line2);border-top:3px solid var(--red);box-shadow:var(--shade)}
.herotext{padding:clamp(18px,3.4vw,36px);display:flex;flex-direction:column;gap:14px;min-width:0}
.brand{display:flex;align-items:center;gap:16px}
.brand .lg{flex:none;background:var(--logo-bg);padding:4px}
.brand img{display:block;width:clamp(86px,11vw,118px);height:auto}
.brand h1{font-size:clamp(1.45rem,2.6vw,2rem);font-weight:600}
.hero .lead{margin:0;color:var(--ink);max-width:56ch;font-size:1.02rem}
.hero .lead b{font-weight:600}
.docs{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.docs li{font-family:var(--f-mono);font-size:.74rem;font-weight:500;letter-spacing:.04em;border:1px solid var(--line2);padding:2px 8px;color:var(--soft)}
.hello{margin:0;font-weight:500;color:var(--soft);font-size:.95rem}
.langpick{display:grid;gap:6px}
.langpick .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));max-width:360px;border:1px solid var(--rule)}
.langpick button{min-height:46px;border:0;background:var(--surface);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.langpick button+button{border-left:1px solid var(--rule)}
.langpick button[aria-pressed="true"]{background:var(--sel);color:var(--onsel)}
.langpick button small{font-family:var(--f-mono);font-size:.72rem;opacity:.7}
.ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.slides{position:relative;min-height:320px;background:#15191E;overflow:hidden;border-left:1px solid var(--line2)}
.slides figure{position:absolute;inset:0;margin:0;opacity:0;transition:opacity 1.8s ease}
.slides figure.on{opacity:1}
.slides img{display:block;width:100%;height:100%;object-fit:cover}
.slides figcaption{position:absolute;left:0;bottom:0;right:0;padding:26px 16px 12px;background:linear-gradient(transparent,rgba(10,12,15,.78));color:#fff;font-family:var(--f-mono);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;display:flex;gap:10px;align-items:baseline}
.slides figcaption b{font-weight:600;color:#fff;background:#E30613;padding:0 6px}
.sdots{position:absolute;right:12px;top:12px;display:flex;gap:6px;z-index:2}
.sdots button{width:22px;height:22px;border:0;background:transparent;padding:0;display:grid;place-items:center}
.sdots button::before{content:"";width:9px;height:9px;background:rgba(255,255,255,.45);border:1px solid rgba(0,0,0,.25)}
.sdots button[aria-current="true"]::before{background:#fff}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}.slides{border-left:0;border-top:1px solid var(--line2);min-height:0;aspect-ratio:16/10}}
@media (prefers-reduced-motion:reduce){.slides figure{transition:none}}

/* differences */
.dv{display:inline-flex;font-family:var(--f-mono);font-weight:700;font-style:normal;font-size:.95rem;letter-spacing:.04em;line-height:1}
.dv i{font-style:normal;padding:5px 6px;color:#fff}.dv i:first-child{background:var(--k-e2)}.dv i:last-child{background:var(--k-e1)}
.membar.difbar .mi{background:var(--char);border-right:1px solid rgba(255,255,255,.18)}
.membar.difbar .mt b{letter-spacing:.14em}
.dv.big{font-size:.78rem}.dv.big i{padding:4px 4px}
.dlead{max-width:70ch;color:var(--soft);margin:0 0 14px}
.dchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.dchip{display:inline-flex;gap:8px;align-items:baseline;border:1px solid var(--rule);background:var(--surface);padding:7px 12px;font-weight:600;font-size:.9rem;color:var(--ink)}
.dchip small{font-family:var(--f-mono);font-size:.74rem;color:var(--soft)}
.dchip[aria-pressed="true"]{background:var(--sel);color:var(--onsel);border-color:var(--sel)}
.dchip[aria-pressed="true"] small{color:inherit;opacity:.8}
.dlist{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.drow{background:var(--surface);border:1px solid var(--line2);border-left:5px solid var(--pc,var(--line2));padding:14px 16px;display:grid;gap:8px;min-width:0;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.drow.p-hoch{--pc:var(--k-crit)}.drow.p-mittel{--pc:var(--k-warn)}.drow.p-tief{--pc:var(--k-info)}
.dtop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--f-mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase}
.drk{font-weight:700;color:var(--ink);min-width:2ch}
.dpr{background:var(--pc);color:#fff;padding:1px 7px;font-weight:600}
.dbe{border:1px solid var(--line2);padding:0 7px;color:var(--soft)}
.drow h3{font-family:var(--f-cond);font-weight:700;font-size:1.15rem;line-height:1.2;margin:0;text-wrap:balance}
.dcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dc{border-top:3px solid var(--k-e2);padding:8px 10px;background:color-mix(in srgb,var(--k-e2) var(--tint-z),transparent);min-width:0}
.dc.e1{border-top-color:var(--k-e1);background:color-mix(in srgb,var(--k-e1) var(--tint-z),transparent)}
.dc .dl{font-family:var(--f-mono);font-weight:700;font-size:.74rem;color:var(--k-e2)}.dc.e1 .dl{color:var(--k-e1)}
.dc p{margin:2px 0 0;font-size:.93rem;line-height:1.45;overflow-wrap:anywhere}
.dwhy{margin:0;color:var(--soft);font-size:.9rem}
.dfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:center}
.dsrc{font-family:var(--f-mono);font-size:.74rem;color:var(--soft);overflow-wrap:anywhere}
@media (max-width:600px){.dcols{grid-template-columns:minmax(0,1fr)}}

/* info boxes (home) */
.infos{position:relative;display:grid;border-left:1px solid var(--line2);background:var(--surface);min-width:0}
.ibox{grid-area:1/1;display:flex;flex-direction:column;gap:10px;align-items:stretch;text-align:left;border:0;background:transparent;color:var(--ink);padding:22px 22px 18px;opacity:0;visibility:hidden;transition:opacity 1.2s ease,visibility 0s 1.2s;min-width:0;cursor:pointer;font:inherit;border-top:5px solid var(--kc,var(--red))}
.ibox.on{opacity:1;visibility:visible;transition:opacity 1.2s ease}
.ibox.k-diff{--kc:var(--k-e2)}.ibox.k-nice{--kc:var(--k-b)}.ibox.k-hot{--kc:var(--k-warn)}
.ibox .ik{display:flex;align-items:center;gap:10px}
.ibox .ik b{font-family:var(--f-mono);font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;background:var(--kc);color:#fff;padding:2px 8px}
.ibox .ie{font-size:1.5rem;line-height:1}
.ibox .ih{font-family:var(--f-cond);font-weight:700;font-size:clamp(1.25rem,2.4vw,1.6rem);line-height:1.15;text-wrap:balance}
.ibox .ix{color:var(--soft);font-size:.93rem;line-height:1.45}
.icmp{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
.icmp th,.icmp td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.icmp thead th{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.06em}
.icmp thead th.e2{color:var(--k-e2)}.icmp thead th.e1{color:var(--k-e1)}
.icmp tbody th{font-weight:500;color:var(--soft)}
.icmp td{font-weight:600}
.irows{margin:0;display:grid;gap:0}
.irows div{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.irows dt{color:var(--soft);font-size:.88rem}.irows dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.ibars{display:grid;gap:8px}
.ib{display:grid;grid-template-columns:5.2rem minmax(0,1fr) 4.6rem;gap:10px;align-items:center;font-size:.86rem;font-variant-numeric:tabular-nums}
.ib .il{font-family:var(--f-mono);font-size:.76rem}
.ib .it{height:12px;background:var(--line)}.ib .it span{display:block;height:100%;background:var(--k-e2)}
.ib.e1 .it span{background:var(--k-e1)}

.acgroup,.acbanner{display:grid;grid-template-columns:minmax(0,160px) minmax(0,1fr);align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line2);padding:8px;margin:26px 0 12px}

/* articles (Fachartikel) */
:root{--k-a:#2364AA;--k-b:#1D7A46;--k-c:#6B4FB0;--k-ok:#1D7A46;--k-warn:#B26A00;--k-crit:#C0261F;--k-info:#6B7480;--k-e2:#E30613;--k-e1:#3E4A57;--tint:11%;--tint-z:3%}

:root[data-theme="dark"]{--k-a:#6AA6E8;--k-b:#4CC27F;--k-c:#AE97F0;--k-ok:#4CC27F;--k-warn:#E8A33D;--k-crit:#FF6A62;--k-info:#9DA6B0;--k-e2:#FF3341;--k-e1:#8E9BAA;--tint:15%;--tint-z:4%}

.atblwrap.long{max-height:min(72vh,640px)}
table.atbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.92rem;line-height:1.45}
table.atbl th,table.atbl td{padding:8px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);min-width:7.5em}
table.atbl th{position:sticky;top:0;z-index:1;background:var(--surface2);font-family:var(--f-cond);font-weight:600;font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);border-bottom:1px solid var(--rule);white-space:nowrap}
table.atbl td:first-child{font-weight:600;border-left:4px solid transparent}
table.atbl th:first-child{border-left:4px solid transparent}
table.atbl tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--ink) var(--tint-z),var(--surface))}
table.atbl tbody tr[class*="k-"] td{background:color-mix(in srgb,var(--k) var(--tint),var(--surface))}
table.atbl tbody tr[class*="k-"]:nth-child(even) td{background:color-mix(in srgb,var(--k) calc(var(--tint) + 4%),var(--surface))}
table.atbl tbody tr[class*="k-"] td:first-child{border-left-color:var(--k)}
table.atbl tbody tr:last-child td{border-bottom:0}
.fnote{max-width:72ch;margin:8px 0 0;color:var(--soft);font-size:.86rem;line-height:1.5}
.tsec{margin-bottom:30px}
.srcs{display:grid;gap:8px;max-width:86ch;margin:0 0 26px}
.srcdrop{background:var(--surface);border:1px solid var(--line2);border-top:3px solid var(--c,var(--red));max-width:86ch;margin:0 0 26px}
.srcdrop>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;cursor:pointer;min-height:48px}
.srcdrop>summary::-webkit-details-marker{display:none}
.srcdrop .sdt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.srcdrop .sdt b{font-family:var(--f-cond);font-size:.95rem;letter-spacing:.08em;text-transform:uppercase}
.srcdrop .sdt small{color:var(--soft);font-size:.85rem}
.srcdrop .sdc .ic{transition:transform .2s}
.srcdrop[open] .sdc .ic{transform:rotate(180deg)}
.srcdrop>summary:hover b{color:var(--c,var(--red))}
.srcdrop .srcs{margin:0;padding:0 16px 16px}

.srcitem{background:var(--surface);border:1px solid var(--line2);padding:10px 14px}
.srcitem .src{color:var(--ink);font-weight:500}
.srcitem details{margin-top:6px}
.srcitem summary{cursor:pointer;font-size:.86rem;font-weight:600;color:var(--soft)}
.srcitem summary:hover{color:var(--ink)}
.aquiz{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line2);border-left:3px solid var(--c,var(--red));padding:14px 16px;margin:0 0 22px}
.aquiz p{margin:0;flex:1 1 240px;color:var(--soft);font-size:.92rem}
.anav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 24px}
.anav button{display:grid;gap:3px;min-width:0;text-align:left;background:var(--surface);border:1px solid var(--line2);padding:12px 14px}
.anav button:hover{border-color:var(--rule)}
.anav button.nx{text-align:right;grid-column:2}
.anav small{font-family:var(--f-cond);font-weight:600;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);display:flex;align-items:center;gap:4px}
.anav button.nx small{justify-content:flex-end}
.anav b{font-weight:600;font-size:.95rem;line-height:1.3;overflow-wrap:anywhere}
@media (max-width:520px){.anav{grid-template-columns:minmax(0,1fr)}.anav button.nx{grid-column:1}table.atbl{font-size:.86rem}table.atbl th,table.atbl td{padding:7px 9px}.prose{font-size:1rem}}
@media print{.topbar,.toc,.aquiz,.anav,.crumbs{display:none}.atblwrap,.atblwrap.long{max-height:none;overflow:visible}}

let TIMER=null;

  if(!qs.length) return;

function tick(){const el=$("#timer");if(!S.quiz||!S.quiz.deadline){stopTimer();return}const left=Math.max(0,Math.round((S.quiz.deadline-Date.now())/1000));

function passageHTML(q,d){
  const k=q.kontext, A="\u0001", B="\u0002";
  const raw=k[0]+A+k[1]+B+k[2];
  let inM=false;
  const seg=s=>{let o=inM?"<mark>":"";s.split(/([\u0001\u0002])/).forEach(x=>{if(x===A){o+="<mark>";inM=true}else if(x===B){o+="</mark>";inM=false}else o+=esc(x)});return o+(inM?"</mark>":"")};
  const BUL=/^([•▪●◦\-–—]|[a-z]\)|\(?\d{1,2}[.)]|\([a-z0-9]{1,3}\))\s/;
  const NOTE=/^(NOTE|CAUTION|WARNING)\b/;
  const isHead=s=>{const l=s.replace(/[^A-Za-z]/g,"");return s.length<=70&&((l.length>=4&&l===l.toUpperCase())||(/^\d{1,2}(\.\d{1,2}){1,4}\.?\s+[A-Z][A-Za-z]/.test(s)&&!/[.,;]$/.test(s)))};
  const paras=raw.split(/\n{2,}/).map(par=>{
    const lines=par.split("\n"); let html="", buf=[];
    const flush=()=>{if(buf.length){html+=`<p>${buf.join("")}</p>`;buf=[]}};
    lines.forEach(line=>{
      const plain=line.replace(/[\u0001\u0002]/g,"").trim();
      if(!plain||(/^(AOM-\d+-\d+|EM\w+\.IDR|\d{1,2}-\d{2}(-\d{2})?|Page \d+(\/\d+)?.*REVISION \d+.*|REVISION \d+.*|Page \d+(\/\d+)?)$/.test(plain)&&!/[\u0001\u0002]/.test(line)&&!inM)){seg(line);return}
      if(isHead(plain)){flush();html+=`<div class="ph">${seg(line)}</div>`}
      else if(NOTE.test(plain)){buf.push(`<span class="pn">${seg(line).replace(/^((?:<mark>)?)(NOTE|CAUTION|WARNING):?/,"$1<b>$2:</b>")}</span>`)}
      else if(BUL.test(plain)){buf.push(`<span class="pl">${seg(line)}</span>`)}
      else buf.push((buf.length&&!/<\/span>$/.test(buf[buf.length-1])?"<br>":"")+seg(line));
    });
    flush(); return html;
  }).join("");
  return `<div class="passage"><div class="pdoc"><span>${esc(d?d.name:q.dok||"")}</span><span>${q.pdfseite?t("ref.page",{n:q.pdfseite}):""}</span></div>${q.kstart?'<span class="ell">… </span>':""}${paras}${q.kend?'<span class="ell"> …</span>':""}</div>`;
}

  <div class="pgrid">
    <section class="panel">
      <h2>${reg?t("prof.title"):t("prof.login")}</h2>
      <form class="form" id="pform" novalidate>
        <div class="field"><label for="pn">${t("prof.name")}</label><input id="pn" name="name" autocomplete="name" required maxlength="80" value="${esc(P.name||"")}" aria-describedby="pn-e"><p class="err" id="pn-e" aria-live="polite"></p></div>
        <div class="field"><label for="pe">${t("prof.email")}</label><input id="pe" name="email" type="email" autocomplete="email" required maxlength="120" value="${esc(P.email||"")}" aria-describedby="pe-e"><p class="err" id="pe-e" aria-live="polite"></p></div>
        <div class="field"><label for="pc">${t("prof.crew")} <small>${t("prof.opt")} ${t("prof.crew.hint")}</small></label><input id="pc" name="crew" autocomplete="off" maxlength="12" value="${esc(P.crew||"")}" style="text-transform:uppercase;font-family:var(--f-mono)"></div>
        <p class="nopw">${IC.info}<span>${t("prof.nopw")}</span></p>
        ${!S.db&&!S.pmsg?`<p class="hint">${t("prof.local.note")}</p>`:""}
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="btn pri" type="submit" id="psave">${reg?t("prof.save"):t("prof.create")}</button><p class="saved ${S.pmsg?S.pmsg[0]:""}" id="pmsg" role="status">${S.pmsg?esc(S.pmsg[1]):""}</p></div>
      </form>
    </section>
    ${reg?`<section>
      <div class="shead"><h2>${t("prof.progress")}</h2><small>${S.uid?t("prof.st.db"):t("prof.st.local")}</small></div>
      <div class="statgrid"><div class="num"><b>${fN(S.st.punkte)}</b><span>${t("st.pts")}</span></div><div class="num"><b>${fN(seen)}</b><span>${t("st.seen")}</span></div><div class="num"><b>${fN(ok)}</b><span>${t("st.ok")}</span></div><div class="num"><b>${fN(tests.length)}</b><span>${t("st.runs")}</span></div></div>
    </section>`:`<section class="panel"><h2>${t("prof.progress")}</h2><p class="hint">${t("prof.nostats")}</p></section>`}
  </div>
  ${reg?`<p class="label">${t("prof.perrub")} <small>${t("prof.perrub.s")}</small></p>
  <div class="rubstats">${RUBS().map(r=>{const p=rubProgress(r.id);return `<div class="rs" style="--c:${rc(r.id)}"><b>${emo(r.id)}${esc(L(r,"name"))}</b><div class="bar"><i style="width:${Math.round(p*100)}%"></i></div><span class="pct">${fP(p)}</span></div>`}).join("")}</div>
  <p class="label">${t("prof.last")}</p>
  <div class="review" style="margin-top:0">${tests.length?tests.slice(0,15).map(x=>`<div class="rev ${x.ok/x.n>=PASS?"r-ok":"r-bad"}"><b>${esc(x.t)} · ${x.m==="pruefung"?t("mode.pr"):t("mode.l")}</b><span class="m">${esc(fD(x.d))} · ${t("prof.okof",{ok:x.ok,n:x.n,p:fP(x.ok/x.n)})}</span></div>`).join(""):`<p class="hint">${t("prof.none")}</p>`}</div>
  <p class="note">${t("prof.ptsnote")}</p>`:""}`;
  $("#pform").onsubmit=async e=>{
    e.preventDefault();
    const name=$("#pn").value.trim(), email=$("#pe").value.trim(), crew=$("#pc").value.trim().toUpperCase();
    const en=!name, ee=!EMAIL_RE.test(email);
    $("#pn").setAttribute("aria-invalid",en); $("#pn-e").textContent=en?t("err.name"):"";
    $("#pe").setAttribute("aria-invalid",ee); $("#pe-e").textContent=ee?t("err.email"):"";
    if(en){$("#pn").focus();return} if(ee){$("#pe").focus();return}
    $("#psave").disabled=true; $("#pmsg").className="saved"; $("#pmsg").textContent=t("prof.saving");
    const p={name,email,crew,upd:new Date().toISOString()};
    const where=await saveProfile(p);
    S.pmsg=where==="db"?["ok",t("prof.saved.db")]:["warn",t("prof.saved.local")];
    paintChrome(); renderProfil();
  };
}
async function saveProfile(p){
  S.profile=p;
  if(S.db&&S.uid){try{await S.db.doc(`data/users/${S.uid}/profile`).set(p);S.profileSrc="db";store.set("profile",null);try{localStorage.removeItem("ep.profile")}catch(e){}return "db"}catch(e){}}
  store.set("profile",p); S.profileSrc="local"; return "local";
}

/* ---------- render ---------- */
function render(){
  if(!DATA) return; renderNav(); paintChrome();
  ({home:renderHome,rubrik:renderRubrik,setup:renderSetup,quiz:renderQuiz,done:renderDone,lib:renderLib,librubrik:renderLibRubrik,libthema:renderLibThema,libkomp:renderLibKomp,artikel:renderArtikel,memory:renderMemory,profil:renderProfil,compliance:renderCompliance,diff:renderDiff}[S.screen]||renderHome)();
}

/* ---------- persistence ---------- */
let saveT=null;
function save(){
  store.set("stats",S.st);
  if(!S.db||!S.uid) return;
  clearTimeout(saveT); saveT=setTimeout(async()=>{
    try{await S.db.doc(`data/users/${S.uid}/stats/main`).set(S.st)}catch(e){}
  },400);
}
function mergeStats(remote){
  if(!remote||!remote.q) return;
  const Lc=S.st; // keep the richer record per question
  for(const [k,v] of Object.entries(remote.q)){const l=Lc.q[k];if(!l||v[0]>l[0])Lc.q[k]=v}
  Lc.punkte=Math.max(Lc.punkte||0,remote.punkte||0);
  const seen=new Set();Lc.tests=[...(Lc.tests||[]),...(remote.tests||[])].filter(x=>{const k=x.d+x.t+x.ok+x.n;if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>a.d<b.d?1:-1).slice(0,40);
}

/* ---------- boot ---------- */
(async function boot(){
  try{const r=await fetch("fragen.json");DATA=await r.json()}catch(e){$("#app").innerHTML=`<div class="loading">${t("loadfail")}</div>`;return}
  if(!Array.isArray(DATA.rubriken))DATA.rubriken=[]; if(!Array.isArray(DATA.fragen))DATA.fragen=[];
  if(S.ac==="E1") S.mac="E1";
  if(S.profile) S.profileSrc="local";
  render();
  if(!window.claude||!window.claude.use) return;
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    S.user=user; if(!db) return; S.db=db;
    S.uid=user?await user.id():null;
    if(S.uid){
      try{const s=await db.doc(`data/users/${S.uid}/stats/main`).get();mergeStats(s.data());store.set("stats",S.st);save()}catch(e){}
      try{const pd=await db.doc(`data/users/${S.uid}/profile`).get();const pv=pd&&pd.data&&pd.data();
        if(pv&&pv.name){S.profile=pv;S.profileSrc="db"}
        else if(S.profile&&S.profile.name){await saveProfile(S.profile)}
      }catch(e){}
      if(["home","profil","rubrik","memory"].includes(S.screen)) render(); else paintChrome();
    }
  }catch(e){}
})();
</script>

</body>
</html>
